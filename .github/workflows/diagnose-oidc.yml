name: Diagnose Cloudsmith OIDC

# Temporary diagnostic. Mints GitHub OIDC tokens with several audiences and
# exchanges each one directly against the Cloudsmith OIDC endpoint, reporting
# the HTTP status and body. Tokens are never printed; only non-secret claims.
#
# Delete this workflow once the OIDC provider is confirmed working.

on: workflow_dispatch

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Exchange tokens with different audiences
        shell: bash
        env:
          NAMESPACE: ${{ vars.CLOUDSMITH_NAMESPACE }}
          SERVICE_SLUG: ${{ vars.CLOUDSMITH_INGEST_SERVICE }}
        run: |
          set -uo pipefail

          ENDPOINT="https://api.cloudsmith.io/openid/${NAMESPACE}/"
          echo "Endpoint:     $ENDPOINT"
          echo "service_slug: $SERVICE_SLUG"
          echo

          {
            echo "# Cloudsmith OIDC diagnosis"
            echo
            printf 'Endpoint: `%s`\n\n' "$ENDPOINT"
            printf 'service_slug: `%s`\n\n' "$SERVICE_SLUG"
            echo '| audience | HTTP | response |'
            echo '| --- | --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"

          try_audience() {
            local audience="$1"

            echo "::group::audience=${audience}"

            local token
            token="$(
              curl -sS \
                -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$(
                  jq -rn --arg a "$audience" '$a|@uri'
                )" \
              | jq -r '.value // empty'
            )"

            if [[ -z "$token" ]]; then
              echo "Could not mint a token for audience: $audience"
              printf '| `%s` | - | could not mint token |\n' \
                "$audience" >> "$GITHUB_STEP_SUMMARY"
              echo "::endgroup::"
              return
            fi

            # Print only non-secret claims, never the token.
            local payload
            payload="$(
              cut -d. -f2 <<< "$token" \
                | tr '_-' '/+' \
                | base64 -d 2>/dev/null
            )"
            echo "claims sent: $(jq -c '{iss, aud, repository, ref}' <<< "$payload")"

            local code body
            code="$(
              curl -sS -o /tmp/exchange.json -w '%{http_code}' \
                -X POST "$ENDPOINT" \
                -H 'Content-Type: application/json' \
                --data "$(
                  jq -n \
                    --arg t "$token" \
                    --arg s "$SERVICE_SLUG" \
                    '{oidc_token: $t, service_slug: $s}'
                )"
            )"

            body="$(head -c 200 /tmp/exchange.json | tr -d '\n')"

            if [[ "$code" == "200" ]]; then
              # Do not print the issued Cloudsmith token.
              body="OK (token issued, redacted)"
            fi

            echo "HTTP $code :: $body"

            printf '| `%s` | %s | `%s` |\n' \
              "$audience" "$code" "$body" >> "$GITHUB_STEP_SUMMARY"

            echo "::endgroup::"
          }

          try_audience "api.cloudsmith.io"
          try_audience "https://github.com/${GITHUB_REPOSITORY_OWNER}"
          try_audience "cloudsmith"
          try_audience "https://api.cloudsmith.io"

          {
            echo
            echo 'If every row is 401 the problem is provider-side:'
            echo 'issuer URL, required claims, service account mapping, or the'
            echo 'provider being disabled. The Cloudsmith error message is the'
            echo 'same for all of those cases.'
          } >> "$GITHUB_STEP_SUMMARY"
